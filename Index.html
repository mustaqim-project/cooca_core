<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Marketing Studio UMKM — Zero-Prompt Visual Content Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46', 900: '#064e3b' },
            amber: { 50: '#fffbeb', 100: '#fef3c7', 500: '#f59e0b', 600: '#d97706' },
            slate: { 850: '#151f32', 900: '#0f172a', 950: '#020617' }
          },
          fontFamily: { sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'] }
        }
      }
    }
  </script>
  <!-- Google Native Session (GAS Compatible) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 9999px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    .shimmer {
      background: linear-gradient(90deg, transparent 25%, rgba(255, 255, 255, 0.3) 50%, transparent 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    /* Google One tier badge colors */
    .tier-free {
      background: linear-gradient(135deg, #64748b, #94a3b8);
    }

    .tier-basic {
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
    }

    .tier-standard {
      background: linear-gradient(135deg, #8b5cf6, #a78bfa);
    }

    .tier-premium {
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
    }

    .tier-ai {
      background: linear-gradient(135deg, #059669, #10b981);
    }

    @keyframes glow-pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
      }

      50% {
        box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
      }
    }

    .glow-ai {
      animation: glow-pulse 2s infinite;
    }

    /* Google Flow & Veo 3 Cinematic Simulation */
    @keyframes veoCameraOrbit {
      0% { transform: scale(1.02) translate(0, 0) rotate(0deg); }
      25% { transform: scale(1.08) translate(-1.5%, -1%) rotate(0.6deg); }
      50% { transform: scale(1.14) translate(1.5%, 1%) rotate(-0.5deg); }
      75% { transform: scale(1.07) translate(1%, -1.5%) rotate(0.4deg); }
      100% { transform: scale(1.02) translate(0, 0) rotate(0deg); }
    }

    @keyframes veoCameraPushIn {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.2) translate(0, -2%); }
      100% { transform: scale(1) translate(0, 0); }
    }

    @keyframes veoLightSweep {
      0% { transform: translateX(-150%) skewX(-20deg); opacity: 0; }
      30% { opacity: 0.55; }
      100% { transform: translateX(250%) skewX(-20deg); opacity: 0; }
    }

    @keyframes audioWave {
      0%, 100% { height: 4px; }
      50% { height: 22px; }
    }

    .veo-orbit-active {
      animation: veoCameraOrbit 9s ease-in-out infinite;
    }

    .veo-pushin-active {
      animation: veoCameraPushIn 7s ease-in-out infinite;
    }

    .veo-light-sweep {
      animation: veoLightSweep 3.2s ease-in-out infinite;
    }

    .veo-paused {
      animation-play-state: paused !important;
    }

    .audio-bar-1 { animation: audioWave 1.1s ease-in-out infinite; }
    .audio-bar-2 { animation: audioWave 0.7s ease-in-out infinite 0.2s; }
    .audio-bar-3 { animation: audioWave 1.4s ease-in-out infinite 0.4s; }
    .audio-bar-4 { animation: audioWave 0.9s ease-in-out infinite 0.1s; }
    .audio-bar-5 { animation: audioWave 1.2s ease-in-out infinite 0.3s; }
  </style>
</head>

<body
  class="bg-slate-50 text-slate-900 min-h-screen antialiased flex flex-col selection:bg-brand-500 selection:text-white">

  <div id="toast-container" class="fixed top-5 right-5 z-[60] flex flex-col gap-2 pointer-events-none"></div>
  <div id="global-modal"
    class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4">
    <div id="modal-content"
      class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto custom-scrollbar p-6 transform transition-all scale-95 opacity-0">
    </div>
  </div>
  <div id="app" class="flex-1 flex flex-col min-h-screen"></div>

  <script>

    // =======================================================
    // ============================================================
    // AI ENGINE: Smart Defaults, Recommendations, Brief Compiler
    // ============================================================

    const AIEngine = {
      // ---- BUSINESS CATEGORY DATABASE ----
      categories: [
        { id: 'fnb', name: 'Makanan & Minuman', icon: '\ud83c\udf5c', subs: ['Restaurant', 'Cafe', 'Bakery', 'Catering', 'Frozen Food', 'Snack', 'Minuman'] },
        { id: 'fashion', name: 'Fashion', icon: '\ud83d\udc57', subs: ['Clothing', 'Hijab', 'Shoes', 'Bags', 'Accessories'] },
        { id: 'beauty', name: 'Beauty & Skincare', icon: '\u2728', subs: ['Skincare', 'Cosmetics', 'Salon', 'Barbershop', 'Nail / Beauty'] },
        { id: 'retail', name: 'Retail & Toko', icon: '\ud83d\udecd\ufe0f', subs: ['Toko Umum', 'Grocery', 'Elektronik', 'Furniture', 'Accessories'] },
        { id: 'jasa', name: 'Jasa & Layanan', icon: '\ud83d\udd27', subs: ['Laundry', 'Workshop', 'Service', 'Photography', 'Agency', 'Consultant'] },
        { id: 'lainnya', name: 'Lainnya', icon: '\ud83d\udce6', subs: [] }
      ],

      // ---- CONTENT GOAL DATABASE ----
      contentGoals: {
        social: {
          group: 'SOCIAL MEDIA',
          items: [
            { id: 'instagram_feed', name: 'Instagram Feed', desc: 'Untuk satu gambar post reguler feed.', ratio: '4:5', icon: '\ud83d\udcf8' },
            { id: 'instagram_carousel', name: 'Instagram Carousel', desc: 'Untuk beberapa slide edukasi/manfaat.', ratio: '4:5', icon: '\ud83d\udcd1' },
            { id: 'instagram_story', name: 'Instagram Story', desc: 'Format vertikal penuh 9:16.', ratio: '9:16', icon: '\ud83d\udcf1' },
            { id: 'reels_cover', name: 'Reels Cover', desc: 'Cover rapi dan menarik untuk Reels.', ratio: '9:16', icon: '\u2728' },
            { id: 'whatsapp_status', name: 'WhatsApp Status', desc: 'Konten vertikal untuk closing order di WA.', ratio: '9:16', icon: '\ud83d\udcac' },
            { id: 'tiktok_cover', name: 'TikTok Cover', desc: 'Thumbnail cover video TikTok.', ratio: '9:16', icon: '\ud83c\udfac' }
          ]
        },
        product: {
          group: 'PRODUCT MARKETING',
          items: [
            { id: 'product_photo', name: 'Product Photo', desc: 'Foto produk profesional studio bersih.', ratio: '1:1', icon: '\ud83d\udce6' },
            { id: 'product_hero', name: 'Product Hero', desc: 'Visual produk premium sebagai foto utama toko.', ratio: '4:5', icon: '\ud83d\udc51' },
            { id: 'product_catalog', name: 'Product Catalog', desc: 'Foto katalog produk terstruktur.', ratio: '1:1', icon: '\ud83d\udcda' },
            { id: 'marketplace', name: 'Marketplace', desc: 'Visual standar Shopee & Tokopedia.', ratio: '1:1', icon: '\ud83d\uded2' },
            { id: 'product_detail', name: 'Product Detail', desc: 'Visual yang menonjolkan tekstur dan detail.', ratio: '1:1', icon: '\ud83d\udd0d' }
          ]
        },
        promo: {
          group: 'PROMOTION',
          items: [
            { id: 'promo', name: 'Promo', desc: 'Visual promosi dengan space teks voucher.', ratio: '1:1', icon: '\ud83c\udff7\ufe0f' },
            { id: 'discount', name: 'Discount Banner', desc: 'Konten diskon dan potongan harga spesial.', ratio: '4:5', icon: '\ud83d\udcb8' },
            { id: 'new_product', name: 'New Product Launch', desc: 'Peluncuran produk baru yang memikat.', ratio: '4:5', icon: '\ud83d\ude80' },
            { id: 'seasonal_campaign', name: 'Seasonal Campaign', desc: 'Tema Ramadan, Natal, Imlek, atau Gajian.', ratio: '4:5', icon: '\ud83c\udf89' }
          ]
        }
      },

      // ---- SMART DEFAULTS ENGINE ----
      getSmartDefaults(category, subCategory, goalId) {
        const profiles = {
          fnb: {
            style: 'Commercial', background: 'Restaurant', atmosphere: 'Warm',
            lighting: 'Warm Light', cameraAngle: '45 Degree', lens: '50mm Standard',
            depthOfField: 'Shallow Depth (Bokeh Halus)', composition: 'Product Hero',
            textSpace: 'Tidak ada', props: [], useModel: 'Tidak'
          },
          fashion: {
            style: 'Editorial', background: 'Studio putih', atmosphere: 'Bright',
            lighting: 'Soft Light', cameraAngle: 'Front', lens: '85mm Portrait',
            depthOfField: 'Shallow Depth (Bokeh Halus)', composition: 'Center',
            textSpace: 'Tidak ada', props: [], useModel: 'Tidak'
          },
          beauty: {
            style: 'Elegant', background: 'Minimalist', atmosphere: 'Fresh',
            lighting: 'Soft Light', cameraAngle: 'Front', lens: '85mm Portrait',
            depthOfField: 'Shallow Depth (Bokeh Halus)', composition: 'Center',
            textSpace: 'Tidak ada', props: [], useModel: 'Tidak'
          },
          retail: {
            style: 'Clean', background: 'Studio putih', atmosphere: 'Bright',
            lighting: 'Studio Light', cameraAngle: '45 Degree', lens: '50mm Standard',
            depthOfField: 'Deep Focus (Tajam Semua)', composition: 'Center',
            textSpace: 'Tidak ada', props: [], useModel: 'Tidak'
          },
          jasa: {
            style: 'Modern', background: 'Minimalist', atmosphere: 'Bright',
            lighting: 'Natural Light', cameraAngle: 'Eye Level', lens: '35mm Street',
            depthOfField: 'Shallow Depth (Bokeh Halus)', composition: 'Rule of Thirds',
            textSpace: 'Bawah', props: [], useModel: 'Tidak'
          },
          lainnya: {
            style: 'Clean', background: 'Studio putih', atmosphere: 'Bright',
            lighting: 'Soft Light', cameraAngle: '45 Degree', lens: '50mm Standard',
            depthOfField: 'Shallow Depth (Bokeh Halus)', composition: 'Center',
            textSpace: 'Tidak ada', props: [], useModel: 'Tidak'
          }
        };

        const base = { ...(profiles[category] || profiles.lainnya) };

        // Sub-category refinements
        const subRefinements = {
          'Cafe': { atmosphere: 'Cozy', background: 'Cafe', lighting: 'Warm Light' },
          'Bakery': { atmosphere: 'Warm', background: 'Kitchen', lighting: 'Golden Light', style: 'Natural' },
          'Frozen Food': { background: 'Studio putih', style: 'Commercial', lighting: 'Studio Light' },
          'Hijab': { style: 'Elegant', useModel: 'Ya' },
          'Clothing': { style: 'Editorial', useModel: 'Ya' },
          'Shoes': { cameraAngle: 'Low Angle', composition: 'Product Hero' },
          'Skincare': { background: 'Marble', atmosphere: 'Fresh', style: 'Luxury' },
          'Cosmetics': { style: 'Luxury', lighting: 'Studio Light', background: 'Marble' },
          'Salon': { useModel: 'Ya', background: 'Minimalist' },
          'Furniture': { cameraAngle: 'Eye Level', lens: '24mm Wide', composition: 'Editorial' },
          'Elektronik': { background: 'Studio hitam', style: 'Modern', lighting: 'Dramatic Light' },
          'Photography': { style: 'Cinematic', lighting: 'Dramatic Light' }
        };
        if (subRefinements[subCategory]) Object.assign(base, subRefinements[subCategory]);

        // Goal-based refinements
        const goalRefinements = {
          'instagram_feed': { textSpace: 'Tidak ada' },
          'instagram_story': { textSpace: 'Bawah', composition: 'Center' },
          'instagram_carousel': { textSpace: 'Bawah' },
          'whatsapp_status': { textSpace: 'Bawah', composition: 'Center' },
          'product_photo': { background: 'Studio putih', style: 'Clean', textSpace: 'Tidak ada', composition: 'Center' },
          'product_hero': { style: 'Premium', composition: 'Product Hero' },
          'marketplace': { background: 'Studio putih', style: 'Clean', textSpace: 'Tidak ada', cameraAngle: '45 Degree' },
          'promo': { textSpace: 'Kiri', composition: 'Left Aligned' },
          'discount': { textSpace: 'Kanan', composition: 'Right Aligned' },
          'new_product': { style: 'Premium', atmosphere: 'Dramatic' },
          'seasonal_campaign': { atmosphere: 'Festive', style: 'Playful' }
        };
        if (goalRefinements[goalId]) Object.assign(base, goalRefinements[goalId]);

        // Auto-select props based on category
        base.props = this.getSmartProps(category, subCategory);

        // Auto aspect ratio from goal
        const allGoals = [...this.contentGoals.social.items, ...this.contentGoals.product.items, ...this.contentGoals.promo.items];
        const goal = allGoals.find(g => g.id === goalId);
        base.aspectRatio = goal ? goal.ratio : '4:5';

        return base;
      },

      // ---- SMART PROPS ENGINE ----
      getSmartProps(category, subCategory) {
        const propsMap = {
          fnb: {
            _default: ['Plate', 'Cutlery'],
            'Restaurant': ['Plate', 'Cutlery', 'Table'],
            'Cafe': ['Coffee beans', 'Glass', 'Table'],
            'Bakery': ['Napkin', 'Ingredients'],
            'Catering': ['Plate', 'Cutlery', 'Napkin'],
            'Frozen Food': [],
            'Snack': ['Napkin'],
            'Minuman': ['Glass', 'Ice']
          },
          fashion: {
            _default: [],
            'Clothing': [],
            'Hijab': [],
            'Shoes': [],
            'Bags': [],
            'Accessories': ['Mirror']
          },
          beauty: {
            _default: ['Flowers'],
            'Skincare': ['Flowers', 'Stone'],
            'Cosmetics': ['Mirror', 'Cosmetic accessories'],
            'Salon': ['Mirror', 'Towels'],
            'Barbershop': [],
            'Nail / Beauty': ['Flowers']
          },
          retail: {
            _default: [],
            'Furniture': [],
            'Elektronik': [],
            'Grocery': [],
            'Accessories': ['Mirror']
          },
          jasa: { _default: [] },
          lainnya: { _default: [] }
        };
        const catProps = propsMap[category] || propsMap.lainnya;
        return catProps[subCategory] || catProps._default || [];
      },

      // ---- AVAILABLE PROPS LIST BY CATEGORY ----
      getAvailableProps(category) {
        const map = {
          fnb: ['Plate', 'Cutlery', 'Table', 'Napkin', 'Ingredients', 'Glass', 'Coffee beans', 'Herbs', 'Ice', 'Sauce', 'Basket'],
          fashion: ['Bag', 'Sunglasses', 'Shoes', 'Jewelry', 'Chair', 'Studio props', 'Mirror', 'Hat', 'Belt'],
          beauty: ['Mirror', 'Flowers', 'Towels', 'Cosmetic accessories', 'Stone', 'Water drops', 'Candles', 'Essential oils'],
          retail: ['Box', 'Plant', 'Table', 'Laptop', 'Phone', 'Minimal props', 'Shelf', 'Light'],
          jasa: ['Laptop', 'Phone', 'Table', 'Plant', 'Business card', 'Notebook'],
          lainnya: ['Box', 'Plant', 'Table', 'Minimal props']
        };
        return map[category] || map.lainnya;
      },

      // ---- RECOMMENDATION ENGINE ----
      getRecommendations(category, subCategory) {
        const recMap = {
          fnb: [
            { label: 'Food Photography', desc: 'Foto piring & makanan menggugah selera', route: 'photo-flow', goalHint: 'product_photo' },
            { label: 'Menu Promo', desc: 'Format harga menu siap posting', route: 'photo-flow', goalHint: 'promo' },
            { label: 'Instagram Feed', desc: 'Post reguler visual memikat', route: 'photo-flow', goalHint: 'instagram_feed' },
            { label: 'Video Sizzle Reels', desc: 'Video asap & tuang saus otomatis', route: 'video-flow', goalHint: null },
            { label: 'WhatsApp Status', desc: 'Ukuran 9:16 order cepat via WA', route: 'photo-flow', goalHint: 'whatsapp_status' }
          ],
          fashion: [
            { label: 'Lookbook Katalog', desc: 'Foto baju bersih background studio', route: 'photo-flow', goalHint: 'product_catalog' },
            { label: 'Product Hero', desc: 'Visual premium item unggulan', route: 'photo-flow', goalHint: 'product_hero' },
            { label: 'IG Carousel OOTD', desc: 'Slide inspirasi gaya berpakaian', route: 'photo-flow', goalHint: 'instagram_carousel' },
            { label: 'TikTok Outfit', desc: 'Video transisi pendek menarik', route: 'video-flow', goalHint: null },
            { label: 'Marketplace', desc: 'Foto produk standar Shopee/Tokped', route: 'photo-flow', goalHint: 'marketplace' }
          ],
          beauty: [
            { label: 'Product Skincare', desc: 'Foto produk elegan marble/stone', route: 'photo-flow', goalHint: 'product_photo' },
            { label: 'Before-After', desc: 'Visual testimoni visual produk', route: 'photo-flow', goalHint: 'instagram_carousel' },
            { label: 'IG Story Promo', desc: 'Flash sale & diskon story', route: 'photo-flow', goalHint: 'instagram_story' },
            { label: 'Tutorial Reels', desc: 'Video singkat cara pemakaian', route: 'video-flow', goalHint: null },
            { label: 'Marketplace', desc: 'Foto marketplace bersih standar', route: 'photo-flow', goalHint: 'marketplace' }
          ],
          retail: [
            { label: 'Product Hero Shot', desc: 'Visual produk elegan marketplace', route: 'photo-flow', goalHint: 'product_hero' },
            { label: 'Marketplace Banner', desc: 'Optimasi Shopee & Tokopedia', route: 'photo-flow', goalHint: 'marketplace' },
            { label: 'Promo Akhir Bulan', desc: 'Diskon gajian dan cashback', route: 'photo-flow', goalHint: 'promo' },
            { label: 'Video Demo', desc: 'Video unboxing dan pemakaian', route: 'video-flow', goalHint: null },
            { label: 'WhatsApp Catalog', desc: 'Konten vertikal jualan WA', route: 'photo-flow', goalHint: 'whatsapp_status' }
          ],
          jasa: [
            { label: 'Branding Visual', desc: 'Visual promosi jasa profesional', route: 'photo-flow', goalHint: 'instagram_feed' },
            { label: 'Promo Layanan', desc: 'Paket diskon dan penawaran', route: 'photo-flow', goalHint: 'promo' },
            { label: 'Social Media Post', desc: 'Konten edukasi & tips', route: 'photo-flow', goalHint: 'instagram_carousel' },
            { label: 'Video Profil', desc: 'Video singkat profil usaha', route: 'video-flow', goalHint: null },
            { label: 'WA Status Promo', desc: 'Promosi cepat via WhatsApp', route: 'photo-flow', goalHint: 'whatsapp_status' }
          ],
          lainnya: [
            { label: 'Product Photo', desc: 'Foto produk studio profesional', route: 'photo-flow', goalHint: 'product_photo' },
            { label: 'Instagram Feed', desc: 'Post IG reguler', route: 'photo-flow', goalHint: 'instagram_feed' },
            { label: 'Promo', desc: 'Visual promosi menarik', route: 'photo-flow', goalHint: 'promo' },
            { label: 'Video Showcase', desc: 'Video pendek produk Anda', route: 'video-flow', goalHint: null }
          ]
        };
        return recMap[category] || recMap.lainnya;
      },

      // ---- QUICK ACTION CARDS (context-aware) ----
      getQuickActions(category) {
        const base = [
          { title: 'Instagram Feed', ratio: '4:5', icon: '\ud83d\udcf8', desc: 'Post reguler dengan visual memikat', goalId: 'instagram_feed' },
          { title: 'Instagram Carousel', ratio: '4:5', icon: '\ud83d\udcd1', desc: 'Slide edukasi & manfaat', goalId: 'instagram_carousel' },
          { title: 'Instagram Story', ratio: '9:16', icon: '\ud83d\udcf1', desc: 'Format vertikal interaktif', goalId: 'instagram_story' },
          { title: 'Product Photo', ratio: '1:1', icon: '\ud83d\udce6', desc: 'Foto produk studio bersih', goalId: 'product_photo' },
          { title: 'Product Catalog', ratio: '1:1', icon: '\ud83d\udcda', desc: 'Katalog terstruktur + harga', goalId: 'product_catalog' },
          { title: 'Marketplace', ratio: '1:1', icon: '\ud83d\uded2', desc: 'Standar Tokopedia & Shopee', goalId: 'marketplace' },
          { title: 'Promo & Diskon', ratio: '1:1', icon: '\ud83c\udff7\ufe0f', desc: 'Voucher dan penawaran spesial', goalId: 'promo' },
          { title: 'WhatsApp Status', ratio: '9:16', icon: '\ud83d\udcac', desc: 'Untuk jualan langsung di WA', goalId: 'whatsapp_status' },
          { title: 'TikTok Cover', ratio: '9:16', icon: '\ud83c\udfac', desc: 'Cover video TikTok', goalId: 'tiktok_cover' },
          { title: 'Reels Cover', ratio: '9:16', icon: '\u2728', desc: 'Cover visual rapi IG Reels', goalId: 'reels_cover' }
        ];
        // Prioritize based on category
        const priority = {
          fnb: ['Instagram Feed', 'WhatsApp Status', 'Product Photo', 'Promo & Diskon', 'Instagram Story'],
          fashion: ['Instagram Feed', 'Instagram Carousel', 'Product Catalog', 'Marketplace', 'TikTok Cover'],
          beauty: ['Instagram Feed', 'Instagram Story', 'Product Photo', 'Instagram Carousel', 'Marketplace'],
          retail: ['Marketplace', 'Product Photo', 'WhatsApp Status', 'Promo & Diskon', 'Product Catalog'],
          jasa: ['Instagram Feed', 'Instagram Carousel', 'WhatsApp Status', 'Instagram Story', 'Promo & Diskon']
        };
        const prio = priority[category] || [];
        return base.sort((a, b) => {
          const ai = prio.indexOf(a.title);
          const bi = prio.indexOf(b.title);
          if (ai === -1 && bi === -1) return 0;
          if (ai === -1) return 1;
          if (bi === -1) return -1;
          return ai - bi;
        });
      },

      // ---- AI BRIEF COMPILER ----
      compileBrief(state) {
        const brief = state.photoFlow.brief;
        return {
          business_type: state.business.category,
          business_sub: state.business.subCategory,
          brand_name: state.business.brandName || null,
          content_goals: state.photoFlow.selectedGoals,
          aspect_ratio: brief.aspectRatio,
          style: brief.style,
          background: brief.background,
          atmosphere: brief.atmosphere,
          lighting: brief.lighting,
          camera_angle: brief.cameraAngle,
          lens: brief.lens,
          depth_of_field: brief.depthOfField,
          composition: brief.composition,
          text_space: brief.textSpace,
          props: brief.props,
          use_model: brief.useModel,
          model_config: brief.useModel === 'Ya' ? { gender: brief.modelGender, age: brief.modelAge, style: brief.modelStyle, pose: brief.modelPose } : null,
          text_requirement: brief.textRequirement,
          headline: brief.headline || null,
          subheadline: brief.subheadline || null,
          cta: brief.cta || null,
          price: brief.price || null,
          custom_instruction: brief.customInstruction || null,
          product_preservation: 'strict_identity_lock',
          detected_product_type: state.photoFlow.detectedType
        };
      },

      // ============================================================
      // ---- SUPER PROMPT SCHEMA ENGINE ----
      // ============================================================
      generateSuperPrompt(state) {
        const brief = state.photoFlow.brief;
        const biz = state.business;
        const goals = state.photoFlow.selectedGoals;

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const iconMap = {
        success: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>',
        error: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>',
        info: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>'
      };
      const bg = type === 'success' ? 'bg-emerald-600' : (type === 'error' ? 'bg-rose-600' : 'bg-slate-800');
      toast.className = `${bg} text-white px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 text-sm font-medium transition-all duration-300 pointer-events-auto transform translate-y-2 opacity-0`;
      toast.innerHTML = `<svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">${iconMap[type] || iconMap.success}</svg><span>${message}</span>`;
      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));
      setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => toast.remove(), 300); }, 3500);
    }

      const tier = GoogleOneAuth.tiers[tierId] || GoogleOneAuth.tiers.standard;
      const credits = (AppState.user && AppState.credits !== undefined) ? AppState.credits : (currentKey ? 100000 : tier.credits);
      const tierName = (AppState.user ? AppState.user.tierName : null) || tier.name;

      const tierColor = (AppState.user ? AppState.user.tierColor : null) || tier.color;
      const tierBadge = (AppState.user ? AppState.user.tierBadge : null) || tier.badge;
      const tierStorage = (AppState.user ? AppState.user.tierStorage : null) || tier.storage;
      const tierMaxCredits = (AppState.user ? AppState.user.tierMaxCredits : null) || tier.credits;
      return { tier, tierId, credits, tierName, tierIcon, tierColor, tierBadge, tierStorage, tierMaxCredits };

      <div class="relative">
        <input type="password" id="gemini-key-input" value="${currentKey}" placeholder="AIzaSy..."
          class="w-full px-3.5 py-2.5 text-xs font-mono bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none">

    function saveGeminiKeyAction() {
      const input = document.getElementById('gemini-key-input');
      const val = (input && input.value ? input.value.trim() : '');

      closeModal();
      renderApp();
      if (val) {
        showToast('\u2713 Gemini API Key aktif! Tier otomatis di-upgrade ke Google One AI Premium (+100.000 kredit).');
      } else {
        showToast('Mode simulasi Google Nano Banana aktif.');
      }

    function triggerGoogleSignIn() {
      const btn = document.getElementById('btn-google-login');

      if (btn) {
        btn.innerHTML = '<svg class="animate-spin h-5 w-5 text-slate-600" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg><span>Menghubungkan ke Google...</span>';
        btn.disabled = true;
      }

      // Check GIS availability
      if ((window.google && window.google.accounts && window.google.accounts.id) && GOOGLE_CLIENT_ID) {
        try {
          google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback: onGoogleCredentialResponse,
            auto_select: false
          });

          let promptShown = false;
          google.accounts.id.prompt((notification) => {
            promptShown = true;
            if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
              // GIS suppressed (e.g. localhost unregistered in Google console) -> open quick connect modal
              setTimeout(() => {
                if (btn) { btn.innerHTML = '<span>Masuk dengan Google (Auto-Detect Tier)</span>'; btn.disabled = false; }
                openQuickAccountConnectModal();
              }, 400);
            }
          });

          // Timeout fallback in case prompt hangs or is suppressed silently on local dev
          setTimeout(() => {
            if (!promptShown) {
              if (btn) { btn.innerHTML = '<span>Masuk dengan Google (Auto-Detect Tier)</span>'; btn.disabled = false; }
              openQuickAccountConnectModal();
            }
          }, 1800);
          return;
        } catch (e) {
          console.warn('GIS init error:', e);
        }
      }

      // Fallback if no GIS or error
      if (btn) { btn.innerHTML = '<span>Masuk dengan Google (Auto-Detect Tier)</span>'; btn.disabled = false; }
      openQuickAccountConnectModal();
    }

        given_name: formattedName.split(' ')[0],

    async function geminiAnalyzeImage(imageDataUrl, fileName = '') {
      AppState.photoFlow.isAnalyzing = true;
      AppState.photoFlow.uploadedImage = imageDataUrl;
      if (fileName) AppState.photoFlow.uploadedImageName = fileName;
      renderApp();

      const apiKey = GoogleOneAuth.getApiKey();
      let parsedResult = null;

      // Prepare image base64 and mime
      let mimeType = 'image/jpeg';
      let base64Data = '';
      if (imageDataUrl && imageDataUrl.startsWith('data:')) {
        const matches = imageDataUrl.match(/^data:([^;]+);base64,(.+)$/);
        if (matches) {
          mimeType = matches[1];
          base64Data = matches[2];
        }
      }

      // If user has a real Gemini API Key, execute real Gemini 3 Flash multimodal call
      if (apiKey && base64Data) {
        // Supported models prioritizing gemini-3-flash, then fallback
        const candidateModels = ['gemini-3-flash', 'gemini-2.5-flash', 'gemini-2.0-flash', 'gemini-1.5-flash'];
        
        const visionPrompt = `Anda adalah Gemini 3 Flash, model AI multimodal mutakhir dari Google. Analisis foto produk yang diupload ini secara mendalam untuk kebutuhan visual marketing studio & e-commerce.
Jawab HANYA dalam format JSON murni tanpa markdown triple backticks (\`\`\`) dengan struktur berikut:
{
  "productName": "Nama jelas dan deskriptif produk (contoh: Iced Caramel Macchiato dengan Double Espresso)",
  "detectedType": "Pilih satu: Makanan | Minuman | Produk | Fashion | Beauty | Elektronik | Kerajinan",
  "dominantColors": "Daftar warna dominan produk & kemasan (contoh: Cokelat karamel keemasan, putih susu, transparan)",
  "materials": "Bahan, tekstur, & material fisik (contoh: Gelas kaca bening, es batu kristal, busa lembut)",
  "keyFeatures": "Fitur kunci subjek untuk dikunci agar tidak berubah (contoh: Layer gradasi cairan kopi dan susu)",
  "recommendedLighting": "Pencahayaan foto yang ideal (contoh: Golden Light atau Studio Light)",
  "recommendedAtmosphere": "Suasana latar yang paling cocok (contoh: Warm Cafe Cozy)",
  "headline": "Satu hook promosi memikat dalam bahasa Indonesia (contoh: Segarnya espresso asli berpadu lembutnya karamel)",
  "detections": [
    "Objek utama teridentifikasi presisi tinggi oleh Gemini 3 Flash",
    "Kontur & geometri subjek produk berhasil dipetakan",
    "Tekstur dan pantulan cahaya diekstraksi untuk SynthID",
    "Konsistensi identitas produk dikunci untuk generasi visual"
  ]
}`;

        for (const model of candidateModels) {
          try {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            const res = await fetch(url, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{
                  parts: [
                    { inline_data: { mime_type: mimeType, data: base64Data } },
                    { text: visionPrompt }
                  ]
                }],
                generationConfig: {
                  temperature: 0.15,
                  response_mime_type: "application/json"
                }
              })
            });

            if (res.ok) {
              const data = await res.json();
              const text = (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] ? data.candidates[0].content.parts[0].text : null);
              if (text) {
                try {
                  const cleaned = text.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim();
                  parsedResult = JSON.parse(cleaned);
                  parsedResult.modelUsed = model;
                  break; // Successful analysis!
                } catch (pe) {
                  console.warn('Gemini JSON parse fallback:', pe);
                }
              }
            } else {
              console.warn(`Model ${model} status:`, res.status);
            }
          } catch (e) {
            console.warn(`Error invoking ${model}:`, e);
          }
        }
      }

      // If no API key or cloud call was not possible, use our intelligent local Gemini 3 Flash vision analyzer
      if (!parsedResult) {
        parsedResult = generateClientVisionAnalysis(imageDataUrl, fileName, AppState.business);
        parsedResult.modelUsed = 'Gemini 3 Flash (Client Vision Engine)';
      }

      // Apply findings to AppState
      AppState.photoFlow.isAnalyzing = false;
      AppState.photoFlow.geminiVisionData = parsedResult;
      AppState.photoFlow.detectedType = parsedResult.detectedType || AIEngine.detectProductType(AppState.business.category);
      if (parsedResult.productName) {
        AppState.photoFlow.uploadedImageName = parsedResult.productName;
      }
      AppState.photoFlow.aiDetections = parsedResult.detections || [
        `Objek: ${parsedResult.productName}`,
        `Warna dominan: ${parsedResult.dominantColors}`,
        `Bahan & material: ${parsedResult.materials}`,
        `Saran lighting: ${parsedResult.recommendedLighting}`
      ];

      // Auto-enrich visual brief settings if empty
      if (parsedResult.headline && (!AppState.photoFlow.brief.headline || AppState.photoFlow.brief.headline === '')) {
        AppState.photoFlow.brief.headline = parsedResult.headline;
      }
      if (parsedResult.recommendedLighting && !AppState.photoFlow.brief.lighting) {
        AppState.photoFlow.brief.lighting = parsedResult.recommendedLighting;
      }
      if (parsedResult.recommendedAtmosphere && !AppState.photoFlow.brief.atmosphere) {
        AppState.photoFlow.brief.atmosphere = parsedResult.recommendedAtmosphere;
      }

      // Synchronize with Video Studio (Google Flow & Veo 3)
      AppState.videoFlow.uploadedImage = imageDataUrl;
      AppState.videoFlow.productName = parsedResult.productName || AppState.photoFlow.uploadedImageName;

      renderApp();
      showToast(`\u2728 Foto berhasil dibaca dengan ${parsedResult.modelUsed}!`);
    }

    async function geminiGenerateImages(superPromptText, uploadedImageDataUrl) {
      const apiKey = GoogleOneAuth.getApiKey();
      if (!apiKey) return null; // No key \u2192 fallback to Google Nano Banana Client Engine

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-preview-image-generation:generateContent?key=${apiKey}`;

      const parts = [];

      // Include uploaded product photo as reference
      if (uploadedImageDataUrl) {
        const matches = uploadedImageDataUrl.match(/^data:([^;]+);base64,(.+)$/);
        if (matches) {
          parts.push({ inline_data: { mime_type: matches[1], data: matches[2] } });
        }
      }
      parts.push({ text: superPromptText });

      // Request 4 Nano Banana variations
      const variations = [
        { label: 'Nano Banana Vivid', suffix: ', vivid commercial saturation, high fidelity studio illumination' },
        { label: 'Nano Banana Warm', suffix: ', warm filmic editorial, golden light, organic depth of field' },
        { label: 'Nano Banana Dynamic', suffix: ', dynamic studio contrast, sharp macro focus, deep shadows' },
        { label: 'Nano Banana Clean', suffix: ', clean minimalist product hero, crisp negative space' }
      ];

      const results = [];
      for (let i = 0; i < variations.length; i++) {
        try {
          const resp = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [...parts.slice(0, -1), { text: superPromptText + variations[i].suffix }] }],
              generationConfig: { responseModalities: ['IMAGE'] }
            })
          });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          let imgUrl = null;
          if (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) data.candidates[0].content.parts.forEach(p => {
            if ((p.inline_data && p.inline_data.mime_type && p.inline_data.mime_type.startsWith)('image/')) {
              imgUrl = `data:${p.inline_data.mime_type};base64,${p.inline_data.data}`;
            }
          });
          if (imgUrl) results.push({ url: imgUrl, label: variations[i].label, isReal: true });
        } catch (e) {
          console.warn('Gemini generation error:', e);
        }
      }
      return results.length > 0 ? results : null;
    }

    function handleVideoFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const dataUrl = e.target.result;
        AppState.videoFlow.uploadedImage = dataUrl;
        const cleanName = file.name.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' ');
        AppState.videoFlow.productName = cleanName;
        AppState.videoFlow.uploadedImageName = file.name;
        renderApp();
        showToast(`\u2713 Foto produk "${cleanName}" berhasil diunggah! Subjek terkunci untuk video.`);
      };
      reader.readAsDataURL(file);
    }

    function handleVideoDrop(event) {
      event.preventDefault();
      const dt = event.dataTransfer;
      if (dt && dt.files && dt.files[0]) {
        const file = dt.files[0];
        const reader = new FileReader();
        reader.onload = e => {
          const dataUrl = e.target.result;
          AppState.videoFlow.uploadedImage = dataUrl;
          const cleanName = file.name.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' ');
          AppState.videoFlow.productName = cleanName;
          AppState.videoFlow.uploadedImageName = file.name;
          renderApp();
          showToast(`\u2713 Foto produk "${cleanName}" berhasil diunggah via drop!`);
        };
        reader.readAsDataURL(file);
      }
    }

    function copyVeo3Prompt() {
      const v = AppState.videoFlow;
      const b = AppState.business;
      const scenes = AIEngine.generateStoryboard(v, b);
      const promptText = `=== GOOGLE FLOW / VEO 3 PRODUCTION SCHEMA ===\n` +
        `Engine: Google Veo 3.1 Pro 4K (Temporal Consistency: High)\n` +
        `Subject Identity: ${v.productName || b.brandName || 'Product'} (Strict ID Lock Active)\n` +

        scenes.map(s => `[SCENE ${s.scene} | ${s.time} | Camera: ${s.cam || v.cameraMovement}]\nVisual: ${s.visual}\nAudio: ${s.audio}${s.vo ? '\nVoiceover: ' + s.vo : ''}`).join('\n\n');
      
      navigator.clipboard.writeText(promptText).then(() => {
        showToast('Prompt Google Veo 3 disalin ke clipboard!');
      }).catch(() => {
        showToast('Gagal menyalin prompt.', 'error');

    // Pipeline Rendering Google Flow Veo 3
    function simulateVideoGen() {
      const v = AppState.videoFlow;
      if (!v.uploadedImage) {
        showToast('Silakan upload foto produk terlebih dahulu sebelum render video!', 'error');
        const fileInput = document.getElementById('video-file-input');
        if (fileInput) fileInput.click();
        return;
      }
      if (AppState.credits < 60) {
        showToast('Kredit tidak cukup untuk render Veo 3 (butuh 60 kredit).', 'error');
        openCreditModal();
        return;
      }
      AppState.credits -= 60;
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.saveUserTierAndCredits(AppState.user ? AppState.user.tierId : 'standard', AppState.credits);
      }
      GoogleOneAuth.syncToStorage();

    function toggleVeoPlayback() {
      const frame = document.getElementById('veo-video-frame');

        frame.classList.remove('veo-paused');
        icon.textContent = '\u23f8';
        icon.classList.remove('ml-0');

        frame.classList.add('veo-paused');

        icon.classList.remove('ml-1');
        icon.classList.add('ml-0');
      }
    }

      <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center text-slate-500 transition">\u2715</button>
    </div>

    
    <div class="bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 text-white p-5 rounded-2xl shadow-lg border border-slate-800 space-y-4">
      <div class="flex items-start justify-between">
        <div>
          <div class="flex items-center gap-2 mb-1">
            <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold uppercase tracking-wider ${isAI ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-slate-700 text-slate-300'}">
              ${g1.tierBadge}
            </span>
            <span class="text-xs text-slate-400">\u2022 ${g1.tierStorage}</span>
          </div>
          <h3 class="text-lg font-extrabold text-white flex items-center gap-1.5">
            ${g1.tierName}
          </h3>
          <p class="text-xs text-slate-400 mt-0.5">${g1.tier.desc}</p>
        </div>
        <div class="text-right">
          <p class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Sisa Kredit Aktif</p>
          <p class="text-3xl font-extrabold font-mono text-emerald-400 mt-0.5 tracking-tight">${AppState.credits.toLocaleString()}</p>
        </div>
      </div>

      
      <div class="space-y-1.5 pt-1">
        <div class="flex justify-between text-xs text-slate-300">
          <span class="flex items-center gap-1"><span>\u26a1</span> Kuota Bulanan: <strong>${g1.tierMaxCredits.toLocaleString()}</strong></span>
          <span class="font-mono text-slate-400">${creditPct}%</span>
        </div>
        <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden border border-slate-700/50">
          <div class="${isAI ? 'bg-gradient-to-r from-emerald-500 to-teal-400' : 'bg-gradient-to-r from-blue-500 to-indigo-400'} h-full rounded-full transition-all duration-500" style="width:${creditPct}%"></div>
        </div>
        <div class="flex justify-between items-center text-[11px] text-slate-400 pt-0.5">
          <span>~${Math.floor(AppState.credits / 40)} batch foto \u2022 ~${Math.floor(AppState.credits / 60)} video Veo 3</span>
          <span class="text-emerald-400 font-medium">Reset tiap awal bulan</span>
        </div>
      </div>
    </div>

    
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
      <button onclick="GoogleOneAuth.syncAndAdjustCredits();"
        class="p-3 rounded-2xl border border-emerald-200 bg-emerald-50/70 hover:bg-emerald-100 text-left transition flex items-center justify-between group shadow-2xs">
        <div class="flex items-center gap-2.5">
          <span class="w-9 h-9 rounded-xl bg-emerald-600 text-white flex items-center justify-center text-sm shadow-xs group-hover:rotate-180 transition-transform duration-500">\ud83d\udd04</span>
          <div>
            <p class="font-bold text-xs text-emerald-950">Sinkronkan Tier</p>
            <p class="text-[10px] text-emerald-700">Sesuaikan kredit akun Google</p>
          </div>
        </div>
        <span class="text-xs font-bold text-emerald-700">&rsaquo;</span>
      </button>

      <button onclick="closeModal(); openGeminiKeyModal();"
        class="p-3 rounded-2xl border ${hasKey ? 'border-blue-200 bg-blue-50/70 hover:bg-blue-100' : 'border-amber-200 bg-amber-50/70 hover:bg-amber-100'} text-left transition flex items-center justify-between group shadow-2xs">
        <div class="flex items-center gap-2.5">
          <span class="w-9 h-9 rounded-xl ${hasKey ? 'bg-blue-600' : 'bg-amber-600'} text-white flex items-center justify-center text-sm shadow-xs">\ud83d\udd11</span>
          <div>
            <p class="font-bold text-xs ${hasKey ? 'text-blue-950' : 'text-amber-950'}">Google AI Studio Key</p>
            <p class="text-[10px] ${hasKey ? 'text-blue-700' : 'text-amber-700'}">${hasKey ? 'Key aktif (100k kredit)' : 'Sambungkan untuk 100k'}</p>
          </div>
        </div>
        <span class="text-xs font-bold ${hasKey ? 'text-blue-700' : 'text-amber-700'}">&rsaquo;</span>
      </button>
    </div>

    
    <div>
      <div class="flex items-center justify-between mb-2">
        <label class="text-xs font-bold text-slate-700 uppercase tracking-wider">Pilih / Alihkan Paket Akun Google:</label>
        <span class="text-[10px] text-slate-400">1-Klik untuk beralih tier</span>
      </div>
      <div class="space-y-2">
        ${Object.values(GoogleOneAuth.tiers).map(t => {
          const isActive = g1.tierId === t.id;
          return `
          <div onclick="GoogleOneAuth.setTier('${t.id}')"
            class="flex items-center gap-3 p-3 rounded-2xl cursor-pointer transition border ${isActive ? 'bg-emerald-50/90 border-emerald-400 shadow-xs ring-1 ring-emerald-400/30' : 'bg-white hover:bg-slate-50 border-slate-200'}">
            <span class="w-9 h-9 rounded-xl ${t.color} text-white flex items-center justify-center text-sm font-bold flex-shrink-0 shadow-xs">${t.icon}</span>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2">
                <p class="font-bold text-xs text-slate-900 truncate">${t.name}</p>
                <span class="text-[9px] font-extrabold uppercase px-1.5 py-0.5 rounded bg-slate-100 text-slate-600">${t.badge}</span>
              </div>
              <p class="text-[10px] text-slate-500 truncate mt-0.5">${t.desc}</p>
            </div>
            <div class="text-right flex-shrink-0">
              <p class="font-mono font-extrabold text-xs ${isActive ? 'text-emerald-700' : 'text-slate-700'}">+${t.credits.toLocaleString()}</p>
              <p class="text-[9px] text-slate-400">${t.id === 'free' ? 'sekali' : '/bulan'}</p>
            </div>
            <div class="flex-shrink-0">
              ${isActive
                ? `<span class="px-2.5 py-1 bg-emerald-600 text-white text-[10px] font-extrabold rounded-lg shadow-2xs">AKTIF</span>`
                : `<button class="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 text-[10px] font-semibold rounded-lg transition">Pilih</button>`
              }
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>

    
    <div class="flex gap-2 pt-2 border-t border-slate-200/80">
      <button onclick="closeModal()" class="flex-1 py-2.5 text-xs font-semibold text-slate-600 border border-slate-200 rounded-xl hover:bg-slate-50 transition">
        Tutup
      </button>
      <button onclick="window.open('https://one.google.com','_blank')"
        class="flex-1 py-2.5 text-xs font-bold bg-slate-900 hover:bg-slate-800 text-white rounded-xl shadow-xs transition flex items-center justify-center gap-1.5">
        <span>\ud83d\ude80</span> Portal Google One \u2197
      </button>
    </div>
    <p class="text-[10px] text-slate-400 text-center">Entitlement dan kuota kredit tersinkron langsung dengan akun Google Anda.</p>
  </div>`);
    }

    function addCredits(n) {
      AppState.credits += n;
      GoogleOneAuth.syncToStorage();
      closeModal();
      renderApp();
      showToast(`+${n.toLocaleString()} kredit ditambahkan!`);
    }

    // Sync credits to storage after each generation
    function executeGenerationWithSync() {
      executeGeneration();
    }

    // ============================================================
    // BOOT \u2014 Native Google Apps Script or Standalone Browser
    // ============================================================
    window.onload = () => {
      // 1. DETEKSI NATIVE GOOGLE APPS SCRIPT (Zero Login API & Zero Manual AI Key)
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((gUser) => {
            if (gUser && gUser.email) {
              const tier = GoogleOneAuth.tiers[gUser.tierId] || GoogleOneAuth.tiers.standard;
              AppState.user = {
                id: gUser.email,
                name: gUser.name || 'Akun Google UMKM',
                email: gUser.email,
                picture: null,
                givenName: gUser.givenName || (gUser.name ? gUser.name.split(' ')[0] : 'UMKM'),
                tierId: tier.id,
                tierName: tier.name,
                tierBadge: tier.badge,
                tierStorage: tier.storage,
                tierMaxCredits: tier.credits,
                tierColor: tier.color,
                tierIcon: tier.icon
              };
              AppState.credits = (gUser.credits !== null && gUser.credits !== undefined) ? gUser.credits : tier.credits;
              
              // Langsung masuk ke Dashboard atau Setup usaha (Tanpa Login Page!)
              AppState.currentRoute = AppState.business.category ? 'dashboard' : 'business-setup';
              renderApp();
              showToast(`\u2713 Terhubung Akun Google: ${gUser.email} (${tier.name})`);
            } else {
              GoogleOneAuth.restoreSession();
              renderApp();
            }
          })
          .withFailureHandler(() => {
            GoogleOneAuth.restoreSession();
            renderApp();
          })
          .getGoogleSessionUser();
        return;
      }

      // 2. STANDALONE BROWSER / LOCALHOST MODE
      const hasStored = GoogleOneAuth.restoreSession();
      renderApp();

      if (GOOGLE_CLIENT_ID) {
        window.addEventListener('load', () => {
          if ((window.google && window.google.accounts && window.google.accounts.id)) {
            google.accounts.id.initialize({
              client_id: GOOGLE_CLIENT_ID,
              callback: onGoogleCredentialResponse,
              auto_select: hasStored
            });
            if (AppState.currentRoute === 'login') {
              google.accounts.id.prompt();
            }
          }
        });
      }
    };

    // Global modal click outside listener
    window.addEventListener('click', (e) => {
      const modal = document.getElementById('global-modal');
      if (e.target === modal) closeModal();
    });

  </script>
</body>
</html>
